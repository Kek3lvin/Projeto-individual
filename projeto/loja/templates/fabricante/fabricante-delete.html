{% extends "base.html" %}
{% load static %}
{% block title %}Excluir Fabricante{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}
{% block content %}
<div id="content">
    <div class="container">

        <form method="POST" action="{% url 'fabricante-delete' fabricante.id %}">
            {% csrf_token %}
            <div class="row">
                <h5 class="col-md-2">Fabricante</h5>
                <input value="{{ fabricante.Fabricante }}" class="form-control col-md-4" disabled>
            </div>
            <div class="row mt-3">
                <button type="submit" class="btn btn-danger col-md-2 mr-2"><i class="fa fa-check"></i> Excluir</button>
                <a href="{% url 'fabricante' %}" class="btn bg-secondary col-md-2"><i class="fa fa-rotate-left"></i> Retornar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
